<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="openclaw-skills-doctor - audit the skills OpenClaw loads">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6edf3" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#e6edf3" stop-opacity="0.00"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="0" fill="url(#bg)"/>
  <rect x="0" y="0" width="6" height="300" fill="url(#accent)"/>

  <g opacity="0.55">
    <circle cx="1010" cy="70" r="120" fill="#58a6ff" opacity="0.08"/>
    <circle cx="1090" cy="250" r="150" fill="#3fb950" opacity="0.07"/>
    <path d="M0 300 L1200 300" stroke="#e6edf3" stroke-opacity="0.06" stroke-width="1"/>
    <path d="M0 250 L1200 250" stroke="#e6edf3" stroke-opacity="0.04" stroke-width="1"/>
    <path d="M0 200 L1200 200" stroke="#e6edf3" stroke-opacity="0.03" stroke-width="1"/>
  </g>

  <g transform="translate(72, 78)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#3fb950" letter-spacing="6" font-weight="600">SKILLS · TOKENS · PRIVACY</text>
    <text x="0" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="58" fill="#f0f6fc" font-weight="700">openclaw-skills-doctor</text>
    <text x="0" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#9fb0c3">Audit the skills OpenClaw loads — one measurement, three ways to run it.</text>
  </g>

  <g transform="translate(72, 232)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#9fb0c3">
    <g>
      <rect x="0" y="0" width="86" height="32" rx="16" fill="#e6edf3" fill-opacity="0.08" stroke="#e6edf3" stroke-opacity="0.12"/>
      <text x="43" y="21" text-anchor="middle" fill="#c9d6e2">CLI</text>
    </g>
    <g transform="translate(98,0)">
      <rect x="0" y="0" width="86" height="32" rx="16" fill="#e6edf3" fill-opacity="0.08" stroke="#e6edf3" stroke-opacity="0.12"/>
      <text x="43" y="21" text-anchor="middle" fill="#c9d6e2">MCP</text>
    </g>
    <g transform="translate(196,0)">
      <rect x="0" y="0" width="176" height="32" rx="16" fill="#e6edf3" fill-opacity="0.08" stroke="#e6edf3" stroke-opacity="0.12"/>
      <text x="88" y="21" text-anchor="middle" fill="#c9d6e2">native plugin</text>
    </g>
    <g transform="translate(384,0)">
      <rect x="0" y="0" width="176" height="32" rx="16" fill="#3fb950" fill-opacity="0.14" stroke="#3fb950" stroke-opacity="0.5"/>
      <text x="88" y="21" text-anchor="middle" fill="#7ee787">100% local · no telemetry</text>
    </g>
  </g>

  <g transform="translate(1024, 128)" opacity="0.9">
    <circle cx="0" cy="0" r="64" fill="none" stroke="#58a6ff" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#3fb950" stroke-opacity="0.35" stroke-width="2"/>
    <path d="M-18 0 L-4 14 L20 -12" fill="none" stroke="#3fb950" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <rect x="0" y="297" width="1200" height="3" fill="url(#accent)" opacity="0.5"/>
